name: Kitbag
options:
  bundleIdPrefix: dev.kosuke
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Kitbag's own logic (timetable model and queries), tested on the Mac with `swift test`.
  Kitbag:
    path: .
  # The guest apps are read from the pinned snapshots that tools/sync_guests.sh makes. See docs/guests.md.
  Headway:
    path: Guests/Headway
  # The same version and source as Headway's own project.yml (keep them equal when Headway changes it).
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  # Headway's Swift sources, compiled unchanged into their own module. Its resources stay out of this target: Headway
  # looks them up in the main bundle, so the app carries them (see the Kitbag target).
  HeadwayGuest:
    type: framework
    platform: iOS
    sources:
      - path: Guests/Headway/App
        excludes:
          - HeadwayApp.swift
          - Info.plist
          - Resources/**
    dependencies:
      - package: Headway
        product: HeadwayCore
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.kitbag.headwayguest
        PRODUCT_MODULE_NAME: HeadwayGuest
        GENERATE_INFOPLIST_FILE: YES
        # Lets App/Guests/HeadwayGuest.swift `@testable import` the guest's internal types, in Release too.
        ENABLE_TESTABILITY: YES
        DEFINES_MODULE: YES
  Kitbag:
    type: application
    platform: iOS
    sources:
      - path: App
      # Headway's resources. Not its Assets.xcassets (only an app icon, which would clash with Kitbag's) and not its
      # InfoPlist.strings (they would rename Kitbag to Headway; App/Resources/*.lproj carries the equivalents).
      - path: Guests/Headway/App/Resources
        excludes:
          - glyphs
          - Assets.xcassets
          - en.lproj
          - ja.lproj
      - path: Guests/Headway/App/Resources/glyphs
        type: folder
        buildPhase: resources
      - path: Guests/Headway/data/maps/madison.pmtiles
        buildPhase: resources
      - path: Guests/Headway/data/punctuality/punctuality.json
        buildPhase: resources
      - path: Guests/Headway/data/seed/mmt_gtfs.zip
        buildPhase: resources
      # The guests' icons, shown as tiles on the home screen.
      - path: Guests/GuestIcons
        type: folder
        buildPhase: resources
    dependencies:
      - package: Kitbag
        product: KitbagCore
      - target: HeadwayGuest
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kitbag
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Kosuke Satake. MIT License.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleLocalizations:
          - en
          - ja
        # What the guests ask of the host (docs/guests.md): Headway shows the rider's position and watches routes.
        NSLocationWhenInUseUsageDescription: Headway shows where you are on the map and finds nearby stops.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.kosuke.headway.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.kitbag
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Kitbag:
    build:
      targets:
        Kitbag: all
