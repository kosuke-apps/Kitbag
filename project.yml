name: Kitbag
options:
  bundleIdPrefix: dev.kosuke
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Kitbag's own logic (timetable model and queries), tested on the Mac with `swift test`.
  Kitbag:
    path: .
  # The guest apps are read from the pinned snapshots that tools/sync_guests.sh makes. See docs/guests.md.
  Headway:
    path: Guests/Headway
  Mantissa:
    path: Guests/Mantissa
  # The same version and source as Headway's own project.yml (keep them equal when Headway changes it).
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  # Headway's Swift sources, compiled unchanged into their own module. Its resources stay out of this target: Headway
  # looks them up in the main bundle, so the app carries them (see the Kitbag target).
  HeadwayGuest:
    type: framework
    platform: iOS
    sources:
      - path: Guests/Headway/App
        excludes:
          - HeadwayApp.swift
          - Info.plist
          - Resources/**
    dependencies:
      - package: Headway
        product: HeadwayCore
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.kitbag.headwayguest
        PRODUCT_MODULE_NAME: HeadwayGuest
        GENERATE_INFOPLIST_FILE: YES
        # Lets App/Guests/HeadwayGuest.swift `@testable import` the guest's internal types, in Release too.
        ENABLE_TESTABILITY: YES
        DEFINES_MODULE: YES
  # Mantissa's Swift sources, the same way (its engine is the MantissaCore package).
  MantissaGuest:
    type: framework
    platform: iOS
    sources:
      - path: Guests/Mantissa/App
        excludes:
          - MantissaApp.swift
          - Info.plist
          - Resources/**
    dependencies:
      - package: Mantissa
        product: MantissaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.kitbag.mantissaguest
        PRODUCT_MODULE_NAME: MantissaGuest
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        DEFINES_MODULE: YES
  # The widgets (home screen and lock screen). They read a copy of the data that the app keeps in the App Group folder
  # (App/Support/WidgetBridge.swift), so they share no code with the app except the few files listed here.
  KitbagWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Theme/Theme.swift
      - path: App/Timetable/CourseColor+Style.swift
      - path: App/Calendar/DeadlineStyle.swift
      - path: App/Timetable/TimetablePage.swift
    dependencies:
      - package: Kitbag
        product: KitbagCore
    entitlements:
      path: Widgets/KitbagWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.kosuke.kitbag
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kitbag
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.kitbag.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
  Kitbag:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # Headway's resources. Not its Assets.xcassets (only an app icon, which would clash with Kitbag's), not its
      # InfoPlist.strings (they would rename Kitbag to Headway; App/Resources/*.lproj carries the equivalents) and not its
      # Localizable.xcstrings: every guest's strings are merged into Guests/Merged (tools/merge_guest_strings.py).
      - path: Guests/Headway/App/Resources
        excludes:
          - glyphs
          - Assets.xcassets
          - en.lproj
          - ja.lproj
          - Localizable.xcstrings
      - path: Guests/Merged
      - path: Guests/Headway/App/Resources/glyphs
        type: folder
        buildPhase: resources
      - path: Guests/Headway/data/maps/madison.pmtiles
        buildPhase: resources
      - path: Guests/Headway/data/punctuality/punctuality.json
        buildPhase: resources
      - path: Guests/Headway/data/seed/mmt_gtfs.zip
        buildPhase: resources
      # The guests' icons, shown as tiles on the home screen.
      - path: Guests/GuestIcons
        type: folder
        buildPhase: resources
      # The licence of Kitbag and the guests (all MIT, the same text), shown in Settings > Licences.
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: Kitbag
        product: KitbagCore
      - target: HeadwayGuest
      - target: MantissaGuest
      - target: KitbagWidgets
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kitbag
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Kosuke Satake. MIT License.
        UILaunchScreen: {}
        # A backup file (.kitbag) that Kitbag can open, so that one sent by AirDrop offers to restore itself.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.kosuke.kitbag.backup
            UTTypeDescription: Kitbag backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - kitbag
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kitbag backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - dev.kosuke.kitbag.backup
        # kitbag://timetable and kitbag://calendar open a tool; the widgets use them.
        CFBundleURLTypes:
          - CFBundleURLName: dev.kosuke.kitbag
            CFBundleURLSchemes:
              - kitbag
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleLocalizations:
          - en
          - ja
        # What the guests ask of the host (docs/guests.md): Headway shows the rider's position and watches routes.
        NSLocationWhenInUseUsageDescription: Kitbag uses your location to show nearby bus stops and the weather where you are.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.kosuke.headway.watch
    entitlements:
      path: App/Kitbag.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.kosuke.kitbag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.kitbag
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icons the person can switch to in Settings (the main one is AppIcon). Drawn by tools/make_icons.swift.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconBook IconPencil IconMonogram IconBag"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Kitbag:
    build:
      targets:
        Kitbag: all
